<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pet Matchmaker | PetCare</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/app.css">
  <script src="js/theme-init.js"></script>
</head>
<body data-page="species">
  <header>
    <nav class="navbar navbar-expand-lg bg-white shadow-sm fixed-top">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">🐾 PetCare</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-label="Toggle menu"><span class="navbar-toggler-icon"></span></button>
        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link active" href="species.html" aria-current="page">Species</a></li>
            <li class="nav-item"><a class="nav-link" href="nutrition.html">Nutrition</a></li>
            <li class="nav-item"><a class="nav-link" href="care.html">Care</a></li>
            <li class="nav-item"><a class="nav-link" href="health.html">Health</a></li>
            <li class="nav-item"><a class="nav-link" href="shelters.html">Shelters</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>
  <main>
    <section class="page-header text-center">
      <div class="container">
        <h1>Pet Matchmaker</h1>
        <p class="lead mb-2">Explore breeds and find one that fits your life.</p>
      </div>
    </section>
    <section class="container pt-5 pb-2">
      <div class="row g-2 align-items-end">
        <div class="col-md-8"><label class="form-label" for="breedSearch">Search breeds</label>
          <input type="search" class="form-control" id="breedSearch" placeholder="Try corgi, calm, large…" autocomplete="off"></div>
        <div class="col-md-4"><label class="form-label" for="breedSpecies">Species</label>
          <select class="form-select" id="breedSpecies"><option value="all">All</option><option value="dog">Dogs</option><option value="cat">Cats</option></select></div>
      </div>
    </section>
    <section class="container py-4">
      <div class="cards-grid" id="breed-grid"></div>
      <p id="breeds-empty" class="text-center mt-4" hidden>No breeds match your search.</p>
    </section>
  </main>
  <a href="health.html#sos" class="sos-btn" aria-label="Urgent help">SOS</a>
  <footer class="text-center py-4 mt-5">
    <div class="container">
      <p class="mb-1">🐾 PetCare – Final Project</p>
      <p class="small mb-0">Educational only. Not a replacement for a veterinarian.</p>
    </div>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/models.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/forms.js"></script>
  <script src="js/pages/species.js"></script>
  <script src="js/main.js"></script>
  <script src="js/jq.js"></script>
</body>
</html>
